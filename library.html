<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poetry Library — Alvin Ngeiywo</title>
  <link rel="icon" type="image/png" href="mylogo-trim.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Patrick+Hand&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=10" />
  <script>
    document.documentElement.setAttribute('data-mode', 'poetic');
    sessionStorage.setItem('mode', 'poetic');
  </script>
</head>
<body>
  <header class="nav" id="top">
    <a href="index.html#top" class="logo">
      <img src="mylogo-trim.png" alt="Alvin Ngeiywo logo" class="logo-img" />
    </a>
    <a href="index.html" class="btn">&larr; Back to portfolio</a>
  </header>

  <main>
    <section id="library" class="section">
      <h1>Library</h1>
      <p class="poem">Every piece, in one quiet room.</p>

      <h2 style="margin: 32px 0 8px;">From the journal</h2>
      <div id="fullPoems"></div>

    </section>
  </main>

  <script src="poems.js"></script>
  <script>
    const container = document.getElementById('fullPoems');
    (window.POEMS || []).forEach(poem => {
      const art = document.createElement('article');
      art.className = 'poem-entry';
      art.id = poem.id;
      const h = document.createElement('h3');
      h.textContent = poem.title;
      const p = document.createElement('p');
      p.className = 'poem-body';
      p.textContent = poem.text;
      p.style.whiteSpace = 'pre-line';
      art.appendChild(h);
      art.appendChild(p);
      container.appendChild(art);
    });
    if (location.hash) {
      const el = document.querySelector(location.hash);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>

  <footer>
    <p>&copy; 2026 Alvin Ngeiywo. alvinngeiywo43@gmail.com</p>
  </footer>
</body>
</html>
